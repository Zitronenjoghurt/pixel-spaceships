[workspace]
resolver = "3"
members = ["app", "core"]

[workspace.package]
authors = ["Zitronenjoghurt"]
edition = "2024"
version = "0.1.0-alpha.1"
license = "MIT"
repository = "https://github.com/Zitronenjoghurt/pixel-spaceships"

[workspace.dependencies]
bevy = "0.19"
bevy_egui = "0.41"
bevy_embedded_assets = "0.16"
serde = { version = "1", features = ["derive"] }
glam = { version = "0.32", features = ["serde"] }
egui-phosphor = { git = "https://github.com/Zitronenjoghurt/egui-phosphor.git", rev = "573b1ff1ee655c0a5eab77d7733d4ae66a2cd570", default-features = false, features = ["regular"] }
pixel-spaceships-core = { path = "core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
